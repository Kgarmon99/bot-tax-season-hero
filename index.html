<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Tax Season Hero</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap');
        
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        :root {
            --bg: #0d1117;
            --card: #161b22;
            --card-light: #21262d;
            --accent: #f85149;
            --accent-light: #ff7b72;
            --success: #3fb950;
            --success-light: #56d364;
            --warning: #d29922;
            --gold: #e3b341;
            --blue: #58a6ff;
            --purple: #a371f7;
        }
        
        body {
            font-family: 'Fredoka', sans-serif;
            background: linear-gradient(180deg, #0d1117 0%, #161b22 100%);
            color: white;
            min-height: 100vh;
            overflow-x: hidden;
        }
        
        .game {
            max-width: 480px;
            margin: 0 auto;
            min-height: 100vh;
            position: relative;
        }
        
        .screen { 
            display: none;
            min-height: 100vh;
            padding: 20px;
            animation: slideIn 0.3s ease;
        }
        .screen.active { display: block; }
        
        @keyframes slideIn {
            from { opacity: 0; transform: translateX(20px); }
            to { opacity: 1; transform: translateX(0); }
        }
        
        /* TITLE SCREEN */
        .title-screen {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            text-align: center;
            padding: 40px 20px;
        }
        
        .hero-mascot {
            width: 140px;
            height: 140px;
            background: linear-gradient(135deg, var(--accent), var(--purple));
            border-radius: 30px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 70px;
            margin-bottom: 24px;
            box-shadow: 0 20px 60px rgba(248, 81, 73, 0.4);
            animation: bounce 2s infinite;
        }
        
        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }
        
        .game-title {
            font-size: 42px;
            font-weight: 700;
            margin-bottom: 8px;
            text-shadow: 0 4px 20px rgba(0,0,0,0.5);
        }
        
        .game-subtitle {
            font-size: 18px;
            color: #8b949e;
            margin-bottom: 40px;
        }
        
        .play-btn {
            background: linear-gradient(135deg, var(--success), var(--success-light));
            color: white;
            border: none;
            padding: 20px 60px;
            font-size: 24px;
            font-weight: 700;
            border-radius: 16px;
            cursor: pointer;
            font-family: inherit;
            box-shadow: 0 10px 40px rgba(63, 185, 80, 0.4);
            transition: all 0.2s;
        }
        
        .play-btn:hover {
            transform: translateY(-2px) scale(1.02);
            box-shadow: 0 15px 50px rgba(63, 185, 80, 0.5);
        }
        
        .play-btn:active {
            transform: translateY(0) scale(0.98);
        }
        
        /* LEVEL SELECT */
        .level-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 24px;
            padding-top: 20px;
        }
        
        .back-btn {
            width: 44px;
            height: 44px;
            background: var(--card);
            border: none;
            border-radius: 12px;
            color: white;
            font-size: 20px;
            cursor: pointer;
        }
        
        .level-title {
            font-size: 28px;
            font-weight: 700;
        }
        
        .xp-bar {
            background: var(--card);
            height: 12px;
            border-radius: 6px;
            margin-bottom: 24px;
            overflow: hidden;
        }
        
        .xp-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--success), var(--success-light));
            width: 33%;
            border-radius: 6px;
        }
        
        .world-title {
            font-size: 14px;
            color: var(--accent);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 12px;
            font-weight: 600;
        }
        
        .level-path {
            display: flex;
            flex-direction: column;
            gap: 16px;
            padding: 20px 0;
        }
        
        .level-node {
            display: flex;
            align-items: center;
            gap: 16px;
            padding: 16px;
            background: var(--card);
            border-radius: 20px;
            cursor: pointer;
            transition: all 0.2s;
            border: 3px solid transparent;
            position: relative;
        }
        
        .level-node:hover:not(.locked) {
            transform: translateX(8px);
            border-color: var(--blue);
        }
        
        .level-node.locked {
            opacity: 0.4;
            cursor: not-allowed;
        }
        
        .level-node.completed {
            border-color: var(--success);
            background: linear-gradient(135deg, var(--card), rgba(63, 185, 80, 0.1));
        }
        
        .level-icon {
            width: 56px;
            height: 56px;
            background: var(--card-light);
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
        }
        
        .level-node.completed .level-icon {
            background: var(--success);
        }
        
        .level-info h3 {
            font-size: 18px;
            margin-bottom: 4px;
        }
        
        .level-info p {
            font-size: 13px;
            color: #8b949e;
        }
        
        .stars {
            position: absolute;
            right: 16px;
            display: flex;
            gap: 4px;
        }
        
        .star {
            font-size: 20px;
            opacity: 0.3;
        }
        
        .star.earned {
            opacity: 1;
        }
        
        /* GAME SCREEN */
        .game-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 20px;
            padding-top: 10px;
        }
        
        .timer-box {
            display: flex;
            align-items: center;
            gap: 12px;
            background: var(--card);
            padding: 12px 20px;
            border-radius: 100px;
        }
        
        .timer-icon {
            font-size: 20px;
        }
        
        .timer-bar {
            width: 100px;
            height: 8px;
            background: var(--card-light);
            border-radius: 4px;
            overflow: hidden;
        }
        
        .timer-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--success), var(--success-light));
            border-radius: 4px;
            transition: width 1s linear;
        }
        
        .timer-fill.danger {
            background: linear-gradient(90deg, var(--accent), var(--accent-light));
            animation: pulse 0.5s infinite;
        }
        
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
        
        .score-pill {
            background: var(--card);
            padding: 12px 20px;
            border-radius: 100px;
            font-weight: 700;
            color: var(--gold);
        }
        
        .client-card {
            background: var(--card);
            border-radius: 24px;
            padding: 24px;
            margin-bottom: 24px;
            border: 2px solid var(--card-light);
        }
        
        .client-header {
            display: flex;
            align-items: center;
            gap: 16px;
            margin-bottom: 16px;
        }
        
        .client-avatar {
            width: 64px;
            height: 64px;
            background: linear-gradient(135deg, var(--blue), var(--purple));
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
        }
        
        .client-name {
            font-size: 22px;
            font-weight: 700;
            margin-bottom: 4px;
        }
        
        .client-job {
            font-size: 14px;
            color: #8b949e;
        }
        
        .client-story {
            font-size: 15px;
            line-height: 1.6;
            color: #c9d1d9;
            padding: 16px;
            background: var(--card-light);
            border-radius: 16px;
        }
        
        .section-label {
            font-size: 13px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #8b949e;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .docs-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
            margin-bottom: 24px;
        }
        
        .doc-card {
            background: var(--card);
            border: 3px solid var(--card-light);
            border-radius: 20px;
            padding: 24px 16px;
            text-align: center;
            cursor: pointer;
            transition: all 0.15s;
        }
        
        .doc-card:hover {
            transform: translateY(-4px);
            border-color: var(--blue);
        }
        
        .doc-card.selected {
            border-color: var(--success);
            background: linear-gradient(135deg, var(--card), rgba(63, 185, 80, 0.15));
            box-shadow: 0 8px 30px rgba(63, 185, 80, 0.3);
        }
        
        .doc-icon {
            font-size: 40px;
            margin-bottom: 8px;
        }
        
        .doc-name {
            font-size: 14px;
            font-weight: 600;
        }
        
        .deduct-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 24px;
        }
        
        .deduct-card {
            background: var(--card);
            border: 3px solid var(--card-light);
            border-radius: 16px;
            padding: 16px;
            display: flex;
            align-items: center;
            gap: 16px;
            cursor: pointer;
            transition: all 0.15s;
        }
        
        .deduct-card:hover {
            border-color: var(--blue);
        }
        
        .deduct-card.selected {
            border-color: var(--success);
            background: linear-gradient(135deg, var(--card), rgba(63, 185, 80, 0.15));
        }
        
        .deduct-card.danger {
            border-color: var(--accent);
        }
        
        .deduct-checkbox {
            width: 32px;
            height: 32px;
            background: var(--card-light);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            transition: all 0.15s;
        }
        
        .deduct-card.selected .deduct-checkbox {
            background: var(--success);
        }
        
        .deduct-info {
            flex: 1;
        }
        
        .deduct-info h4 {
            font-size: 16px;
            margin-bottom: 4px;
        }
        
        .deduct-info p {
            font-size: 13px;
            color: #8b949e;
        }
        
        .danger-tag {
            font-size: 11px;
            color: var(--accent);
            margin-top: 4px;
            font-weight: 600;
        }
        
        .deduct-amount {
            font-size: 18px;
            font-weight: 700;
            color: var(--gold);
        }
        
        .action-btn {
            width: 100%;
            background: linear-gradient(135deg, var(--accent), var(--purple));
            color: white;
            border: none;
            padding: 20px;
            font-size: 20px;
            font-weight: 700;
            border-radius: 16px;
            cursor: pointer;
            font-family: inherit;
            box-shadow: 0 10px 40px rgba(248, 81, 73, 0.4);
            transition: all 0.2s;
        }
        
        .action-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 15px 50px rgba(248, 81, 73, 0.5);
        }
        
        /* RESULTS */
        .result-screen {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            min-height: 100vh;
        }
        
        .result-emoji {
            font-size: 100px;
            margin-bottom: 24px;
            animation: celebrate 0.6s ease;
        }
        
        @keyframes celebrate {
            0% { transform: scale(0) rotate(-20deg); }
            50% { transform: scale(1.2) rotate(10deg); }
            100% { transform: scale(1) rotate(0); }
        }
        
        .result-title {
            font-size: 36px;
            font-weight: 700;
            margin-bottom: 8px;
        }
        
        .result-subtitle {
            font-size: 16px;
            color: #8b949e;
            margin-bottom: 40px;
        }
        
        .stats-card {
            background: var(--card);
            border-radius: 24px;
            padding: 24px;
            width: 100%;
            margin-bottom: 24px;
        }
        
        .stat-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 14px 0;
            border-bottom: 1px solid var(--card-light);
        }
        
        .stat-row:last-child {
            border-bottom: none;
            padding-top: 20px;
            margin-top: 10px;
            border-top: 2px solid var(--card-light);
        }
        
        .stat-label {
            font-size: 15px;
            color: #8b949e;
        }
        
        .stat-value {
            font-size: 17px;
            font-weight: 700;
        }
        
        .stat-value.success { color: var(--success); }
        .stat-value.danger { color: var(--accent); }
        .stat-value.gold { color: var(--gold); font-size: 24px; }
        
        .next-btn {
            width: 100%;
            background: linear-gradient(135deg, var(--success), var(--success-light));
            color: white;
            border: none;
            padding: 20px;
            font-size: 20px;
            font-weight: 700;
            border-radius: 16px;
            cursor: pointer;
            font-family: inherit;
        }
    </style>
</head>
<body>
    <div class="game">
        <!-- TITLE SCREEN -->
        <div class="screen active" id="titleScreen">
            <div class="title-screen">
                <div class="hero-mascot">🤖</div>
                <h1 class="game-title">Tax Season Hero</h1>
                <p class="game-subtitle">Master tax filing and save the day!</p>
                <button class="play-btn" onclick="showScreen('levelScreen'); renderLevels();">▶ PLAY NOW</button>
            </div>
        </div>

        <!-- LEVEL SELECT -->
        <div class="screen" id="levelScreen">
            <div class="level-header">
                <button class="back-btn" onclick="showScreen('titleScreen')">←</button>
                <h2 class="level-title">Select Level</h2>
                <div style="width:44px"></div>
            </div>
            
            <div class="xp-bar">
                <div class="xp-fill" id="xpFill"></div>
            </div>
            
            <div class="world-title">📚 Tax Training Camp</div>
            <div class="level-path" id="levelsList"></div>
        </div>

        <!-- GAME SCREEN -->
        <div class="screen" id="gameScreen">
            <div class="game-header">
                <button class="back-btn" onclick="showScreen('levelScreen')">←</button>
                <div class="timer-box">
                    <span class="timer-icon">⏱️</span>
                    <div class="timer-bar">
                        <div class="timer-fill" id="timerFill"></div>
                    </div>
                </div>
                <div class="score-pill" id="levelScore">⭐ 0</div>
            </div>
            
            <div class="client-card">
                <div class="client-header">
                    <div class="client-avatar" id="clientAvatar">👤</div>
                    <div>
                        <div class="client-name" id="clientName">Client</div>
                        <div class="client-job" id="clientJob">Job</div>
                    </div>
                </div>
                <div class="client-story" id="clientStory">Story...</div>
            </div>
            
            <div class="section-label">📄 Documents</div>
            <div class="docs-grid" id="docsList"></div>
            
            <div class="section-label" id="deductLabel" style="display:none;">💰 Deductions</div>
            <div class="deduct-list" id="deductList"></div>
            
            <button class="action-btn" id="fileBtn">📤 FILE RETURN</button>
        </div>

        <!-- RESULTS -->
        <div class="screen" id="resultScreen">
            <div class="result-screen">
                <div class="result-emoji" id="resultEmoji">🎉</div>
                <h2 class="result-title" id="resultTitle">Level Complete!</h2>
                <p class="result-subtitle" id="resultSubtitle">Great job helping your client!</p>
                
                <div class="stats-card">
                    <div class="stat-row">
                        <span class="stat-label">Status</span>
                        <span class="stat-value" id="resStatus">-</span>
                    </div>
                    <div class="stat-row">
                        <span class="stat-label">Documents</span>
                        <span class="stat-value" id="resDocs">-</span>
                    </div>
                    <div class="stat-row">
                        <span class="stat-label">Deductions</span>
                        <span class="stat-value" id="resDeduct">-</span>
                    </div>
                    <div class="stat-row">
                        <span class="stat-label">Time Bonus</span>
                        <span class="stat-value success" id="resTime">-</span>
                    </div>
                    <div class="stat-row">
                        <span class="stat-label">Total Score</span>
                        <span class="stat-value gold" id="resScore">-</span>
                    </div>
                </div>
                
                <button class="next-btn" onclick="showScreen('levelScreen'); renderLevels();">CONTINUE →</button>
            </div>
        </div>
    </div>

    <script>
        const LEVELS = {
            1: { name: "Maya", job: "First Job", avatar: "🍦", story: "Maya got her first paycheck! Made $3,200 with $280 withheld. Help her file with her W-2!", docs: [{id:'w2', name:'W-2 Form', icon:'🧾', correct:true}, {id:'fake', name:'1099-NEC', icon:'📋', correct:false}], deducts: [], time: 60 },
            2: { name: "Alex", job: "Lifeguard", avatar: "🏊", story: "Alex made $4,200 lifeguarding. Got a W-2 AND a mysterious 1099. Which forms should he file?", docs: [{id:'w2', name:'W-2', icon:'🏊', correct:true}, {id:'fake', name:'1099', icon:'📋', correct:false}], deducts: [], time: 60 },
            3: { name: "Taylor", job: "Designer", avatar: "🎨", story: "Taylor made $4,500 on a 1099. No taxes were taken out - this is different from a W-2!", docs: [{id:'1099', name:'1099-NEC', icon:'🎨', correct:true}, {id:'fake', name:'W-2', icon:'📄', correct:false}], deducts: [], time: 60 },
            4: { name: "Jordan", job: "Dual Income", avatar: "☕", story: "Jordan has a W-2 job ($8,500) AND 1099 freelance ($3,200). Plus a $1,200 camera purchase!", docs: [{id:'w2', name:'W-2', icon:'☕', correct:true}, {id:'1099', name:'1099', icon:'📷', correct:true}], deducts: [{id:'cam', name:'Camera', desc:'Business equipment', amount:1200, correct:true}, {id:'coffee', name:'Coffee', desc:'Personal expense', amount:450, correct:false, danger:true}], time: 90 },
            5: { name: "Riley", job: "Tutor", avatar: "📚", story: "Riley tutors math ($5,000 on 1099) and drove 600 miles between students. Claim that mileage!", docs: [{id:'1099', name:'1099', icon:'📚', correct:true}], deducts: [{id:'miles', name:'Mileage', desc:'600 miles x $0.67', amount:402, correct:true}, {id:'commute', name:'Commute', desc:'Not deductible', amount:850, correct:false, danger:true}], time: 90 },
            6: { name: "Casey", job: "Social Media", avatar: "📱", story: "Casey has $12,000 in 1099 income. Some deductions look suspicious. Spot the red flags!", docs: [{id:'1099', name:'1099', icon:'📱', correct:true}], deducts: [{id:'phone', name:'Phone', desc:'60% business use', amount:540, correct:true}, {id:'round', name:'Round Numbers', desc:'Audit red flag!', amount:3000, correct:false, danger:true}], time: 90 },
            7: { name: "Sam", job: "Gig Worker", avatar: "🚗", story: "Sam drives Uber ($18,000) AND DoorDash ($8,500). Two 1099s! Plus vehicle expenses.", docs: [{id:'uber', name:'1099-K', icon:'🚗', correct:true}, {id:'dd', name:'1099-NEC', icon:'🍔', correct:true}], deducts: [{id:'car', name:'Vehicle', desc:'Standard mileage', amount:4200, correct:true}, {id:'food', name:'Meals', desc:'Personal only', amount:2400, correct:false, danger:true}], time: 105 },
            8: { name: "Jordan", job: "Crypto Trader", avatar: "💎", story: "Jordan lost $2,000 trading crypto. Learn how losses can actually HELP your taxes!", docs: [{id:'crypto', name:'1099-B', icon:'💎', correct:true}], deducts: [{id:'loss', name:'Loss Deduction', desc:'Up to $3,000', amount:2000, correct:true}, {id:'hide', name:'Hide It', desc:'IRS knows!', amount:0, correct:false, danger:true}], time: 90 },
            9: { name: "Alex", job: "Final Boss", avatar: "🏆", story: "The ultimate test! W-2, 1099, crypto losses, AND 800 miles. You got this!", docs: [{id:'w2', name:'W-2', icon:'🏊', correct:true}, {id:'1099', name:'1099', icon:'💻', correct:true}, {id:'crypto', name:'1099-B', icon:'💎', correct:true}], deducts: [{id:'miles', name:'Miles', desc:'800 business miles', amount:536, correct:true}, {id:'laptop', name:'Laptop', desc:'Work equipment', amount:1200, correct:true}, {id:'crypto', name:'Loss', desc:'Capital loss', amount:1500, correct:true}, {id:'office', name:'Home Office', desc:'Questionable!', amount:2400, correct:false, danger:true}], time: 120 }
        };

        let state = { score: 0, unlocked: [1,2,3], completed: [], current: null, selectedDocs: new Set(), selectedDeducts: new Set(), timer: null, timeLeft: 0 };

        function showScreen(id) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.getElementById(id).classList.add('active');
        }

        function renderLevels() {
            const list = document.getElementById('levelsList');
            list.innerHTML = '';
            
            const progress = (state.completed.length / 9) * 100;
            document.getElementById('xpFill').style.width = progress + '%';
            
            for (let i = 1; i <= 9; i++) {
                const lvl = LEVELS[i];
                const locked = !state.unlocked.includes(i);
                const completed = state.completed.includes(i);
                
                const node = document.createElement('div');
                node.className = 'level-node' + (locked ? ' locked' : '') + (completed ? ' completed' : '');
                
                const stars = completed ? '⭐⭐⭐' : '☆☆☆';
                
                node.innerHTML = `
                    <div class="level-icon">${lvl.avatar}</div>
                    <div class="level-info">
                        <h3>${i}. ${lvl.name}</h3>
                        <p>${lvl.job}</p>
                    </div>
                    <div class="stars">${stars}</div>
                `;
                
                if (!locked) node.onclick = () => startLevel(i);
                list.appendChild(node);
            }
        }

        function startLevel(n) {
            state.current = n;
            state.selectedDocs.clear();
            state.selectedDeducts.clear();
            const lvl = LEVELS[n];
            
            document.getElementById('levelScore').textContent = '⭐ ' + state.score;
            document.getElementById('clientAvatar').textContent = lvl.avatar;
            document.getElementById('clientName').textContent = lvl.name;
            document.getElementById('clientJob').textContent = lvl.job;
            document.getElementById('clientStory').textContent = lvl.story;
            
            const docsList = document.getElementById('docsList');
            docsList.innerHTML = '';
            lvl.docs.forEach(doc => {
                const div = document.createElement('div');
                div.className = 'doc-card';
                div.innerHTML = `<div class="doc-icon">${doc.icon}</div><div class="doc-name">${doc.name}</div>`;
                div.onclick = () => {
                    div.classList.toggle('selected');
                    state.selectedDocs.has(doc.id) ? state.selectedDocs.delete(doc.id) : state.selectedDocs.add(doc.id);
                };
                docsList.appendChild(div);
            });
            
            const deductList = document.getElementById('deductList');
            const deductLabel = document.getElementById('deductLabel');
            deductList.innerHTML = '';
            
            if (lvl.deducts.length) {
                deductLabel.style.display = 'flex';
                lvl.deducts.forEach(d => {
                    const div = document.createElement('div');
                    div.className = 'deduct-card' + (d.danger ? ' danger' : '');
                    div.innerHTML = `
                        <div class="deduct-checkbox">✓</div>
                        <div class="deduct-info">
                            <h4>${d.name}</h4>
                            <p>${d.desc}</p>
                            ${d.danger ? '<div class="danger-tag">⚠️ Audit Risk!</div>' : ''}
                        </div>
                        <div class="deduct-amount">$${d.amount.toLocaleString()}</div>
                    `;
                    div.onclick = () => {
                        div.classList.toggle('selected');
                        state.selectedDeducts.has(d.id) ? state.selectedDeducts.delete(d.id) : state.selectedDeducts.add(d.id);
                    };
                    deductList.appendChild(div);
                });
            } else {
                deductLabel.style.display = 'none';
            }
            
            state.timeLeft = lvl.time;
            updateTimer();
            if (state.timer) clearInterval(state.timer);
            state.timer = setInterval(() => {
                state.timeLeft--;
                updateTimer();
                if (state.timeLeft <= 0) { clearInterval(state.timer); fileReturn(); }
            }, 1000);
            
            showScreen('gameScreen');
        }

        function updateTimer() {
            const pct = (state.timeLeft / LEVELS[state.current].time) * 100;
            const fill = document.getElementById('timerFill');
            fill.style.width = pct + '%';
            fill.className = 'timer-fill' + (pct < 25 ? ' danger' : '');
        }

        function fileReturn() {
            if (state.timer) clearInterval(state.timer);
            const lvl = LEVELS[state.current];
            
            let score = 0, correctDocs = 0, correctDeducts = 0, auditRisk = 0;
            
            lvl.docs.forEach(d => {
                if (d.correct && state.selectedDocs.has(d.id)) { score += 100; correctDocs++; }
                else if (!d.correct && state.selectedDocs.has(d.id)) { score -= 50; auditRisk++; }
            });
            
            lvl.deducts.forEach(d => {
                if (d.correct && state.selectedDeducts.has(d.id)) { score += 50; correctDeducts++; }
                else if (!d.correct && state.selectedDeducts.has(d.id)) { score -= 100; auditRisk += 2; }
            });
            
            const timeBonus = state.timeLeft * 2;
            score += timeBonus;
            
            const audited = auditRisk >= 2;
            const passed = !audited && score > 0;
            
            document.getElementById('resultEmoji').textContent = audited ? '😰' : passed ? '🎉' : '😅';
            document.getElementById('resultTitle').textContent = audited ? 'Audit!' : passed ? 'Victory!' : 'Try Again!';
            document.getElementById('resultSubtitle').textContent = audited ? 'The IRS is reviewing this return' : passed ? 'You saved the day!' : 'Keep learning and try again!';
            
            const statusEl = document.getElementById('resStatus');
            statusEl.textContent = audited ? 'Under Review' : passed ? 'Approved!' : 'Rejected';
            statusEl.className = 'stat-value ' + (audited ? 'danger' : passed ? 'success' : '');
            
            document.getElementById('resDocs').textContent = `${correctDocs}/${lvl.docs.filter(d => d.correct).length}`;
            document.getElementById('resDeduct').textContent = `$${correctDeducts * 50}`;
            document.getElementById('resTime').textContent = `+${timeBonus}`;
            document.getElementById('resScore').textContent = Math.max(0, score);
            
            if (passed && !state.completed.includes(state.current)) {
                state.completed.push(state.current);
                const next = state.current + 1;
                if (next <= 9 && !state.unlocked.includes(next)) state.unlocked.push(next);
            }
            state.score += Math.max(0, score);
            
            showScreen('resultScreen');
        }

        document.getElementById('fileBtn').onclick = fileReturn;
    </script>
</body>
</html>
