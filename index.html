<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tax Season Hero</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #1a1a2e;
            color: #f5f3ef;
            min-height: 100vh;
        }
        
        .container {
            max-width: 480px;
            margin: 0 auto;
            padding: 16px;
        }
        
        .screen { display: none; }
        .screen.active { display: block; }
        
        /* Header */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px;
            background: #f5f3ef;
            color: #1a1a2e;
            border-radius: 12px;
            margin-bottom: 16px;
        }
        
        .header h1 { font-size: 20px; }
        .score { font-size: 14px; color: #059669; font-weight: bold; }
        
        /* Level Cards */
        .level-card {
            background: #f5f3ef;
            color: #1a1a2e;
            padding: 16px;
            border-radius: 12px;
            margin-bottom: 12px;
            cursor: pointer;
            border: 2px solid #2d2d44;
        }
        
        .level-card.locked {
            opacity: 0.5;
            cursor: not-allowed;
        }
        
        .level-card h3 { font-size: 18px; margin-bottom: 4px; }
        .level-card p { font-size: 13px; color: #2d2d44; }
        .level-num { 
            float: right; 
            background: #1a1a2e; 
            color: #f5f3ef;
            padding: 4px 12px;
            border-radius: 4px;
            font-size: 12px;
        }
        
        /* Game Screen */
        .timer-bar {
            height: 8px;
            background: #2d2d44;
            border-radius: 4px;
            margin-bottom: 16px;
            overflow: hidden;
        }
        
        .timer-fill {
            height: 100%;
            background: #2563eb;
            width: 100%;
            transition: width 1s linear;
        }
        
        .client-box {
            background: #f5f3ef;
            color: #1a1a2e;
            padding: 16px;
            border-radius: 12px;
            margin-bottom: 16px;
        }
        
        .client-box h2 { font-size: 20px; margin-bottom: 8px; }
        .client-box p { font-size: 14px; line-height: 1.5; color: #2d2d44; }
        
        /* Documents */
        .section-title {
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 12px;
            color: rgba(245, 243, 239, 0.7);
        }
        
        .doc-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 16px;
        }
        
        .doc-card {
            background: #f5f3ef;
            color: #1a1a2e;
            padding: 16px;
            border-radius: 8px;
            text-align: center;
            cursor: pointer;
            border: 2px solid transparent;
        }
        
        .doc-card.selected {
            border-color: #059669;
            background: #e8f5e9;
        }
        
        .doc-card .icon { font-size: 32px; margin-bottom: 8px; }
        .doc-card .name { font-size: 13px; font-weight: 600; }
        
        /* Deductions */
        .deduction-list { margin-bottom: 16px; }
        
        .deduction-item {
            background: #f5f3ef;
            color: #1a1a2e;
            padding: 14px;
            border-radius: 8px;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 12px;
            cursor: pointer;
        }
        
        .deduction-item.selected {
            border: 2px solid #059669;
            background: #e8f5e9;
        }
        
        .deduction-item.audit {
            border: 2px solid #c41e3a;
        }
        
        .check { 
            width: 24px; 
            height: 24px; 
            border: 2px solid #2d2d44;
            border-radius: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .deduction-item.selected .check {
            background: #059669;
            border-color: #059669;
            color: white;
        }
        
        .deduction-info { flex: 1; }
        .deduction-info h4 { font-size: 14px; margin-bottom: 2px; }
        .deduction-info p { font-size: 12px; color: #2d2d44; }
        .deduction-amt { font-weight: bold; color: #059669; }
        .audit-warning { font-size: 11px; color: #c41e3a; margin-top: 4px; display: none; }
        .deduction-item.audit .audit-warning { display: block; }
        
        /* Buttons */
        .btn {
            width: 100%;
            padding: 16px;
            background: #2563eb;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 16px;
        }
        
        .btn:hover { background: #1d4ed8; }
        
        .btn-secondary {
            background: #2d2d44;
            margin-top: 8px;
        }
        
        .btn-secondary:hover { background: #1a1a2e; }
        
        /* Results */
        .result-box {
            background: #f5f3ef;
            color: #1a1a2e;
            padding: 20px;
            border-radius: 12px;
            margin-bottom: 16px;
        }
        
        .result-row {
            display: flex;
            justify-content: space-between;
            padding: 10px 0;
            border-bottom: 1px solid #e8e4dc;
        }
        
        .result-row:last-child { border-bottom: none; }
        .result-label { font-size: 14px; color: #2d2d44; }
        .result-value { font-weight: 600; }
        .result-value.good { color: #059669; }
        .result-value.bad { color: #c41e3a; }
    </style>
</head>
<body>
    <div class="container">
        <!-- HEADER -->
        <div class="header">
            <h1>📊 Tax Hero</h1>
            <div class="score">Score: <span id="totalScore">0</span></div>
        </div>

        <!-- HOME SCREEN -->
        <div class="screen active" id="homeScreen">
            <div id="levelsList"></div>
        </div>

        <!-- GAME SCREEN -->
        <div class="screen" id="gameScreen">
            <div class="timer-bar"><div class="timer-fill" id="timerFill"></div></div>
            
            <div class="client-box">
                <h2 id="clientName">Client</h2>
                <p id="clientStory">Story here...</p>
            </div>
            
            <div class="section-title">Tax Documents</div>
            <div class="doc-grid" id="docsList"></div>
            
            <div class="section-title" id="deductTitle" style="display:none;">Deductions</div>
            <div class="deduction-list" id="deductList"></div>
            
            <button class="btn" id="fileBtn">FILE RETURN</button>
        </div>

        <!-- RESULTS SCREEN -->
        <div class="screen" id="resultScreen">
            <div class="result-box">
                <div class="result-row">
                    <span class="result-label">Status</span>
                    <span class="result-value" id="resStatus">-</span>
                </div>
                <div class="result-row">
                    <span class="result-label">Documents</span>
                    <span class="result-value good" id="resDocs">-</span>
                </div>
                <div class="result-row">
                    <span class="result-label">Deductions</span>
                    <span class="result-value" id="resDeduct">-</span>
                </div>
                <div class="result-row">
                    <span class="result-label">Refund</span>
                    <span class="result-value good" id="resRefund">-</span>
                </div>
                <div class="result-row">
                    <span class="result-label">Score</span>
                    <span class="result-value good" id="resScore">-</span>
                </div>
            </div>
            <button class="btn" id="continueBtn">CONTINUE</button>
        </div>
    </div>

    <script>
        // GAME DATA
        const LEVELS = {
            1: {
                name: "Maya Johnson",
                story: "Maya just got her first paycheck! She made $3,200 and had $280 withheld. Help her file with her W-2.",
                docs: [
                    { id: 'w2', name: 'W-2 Form', icon: '🧾', correct: true },
                    { id: 'fake', name: '1099-NEC', icon: '📋', correct: false }
                ],
                deductions: [],
                refund: 280,
                time: 60
            },
            2: {
                name: "Alex Rivera",
                story: "Alex lifeguarded at the pool ($4,200). Got a W-2 but also something called a 1099 in the mail...",
                docs: [
                    { id: 'w2', name: 'W-2 Pool', icon: '🏊', correct: true },
                    { id: 'fake', name: '1099-NEC', icon: '📋', correct: false }
                ],
                deductions: [],
                refund: 350,
                time: 60
            },
            3: {
                name: "Taylor Kim",
                story: "Taylor is a freelance designer with $4,500 on a 1099. No taxes were withheld - this is different!",
                docs: [
                    { id: '1099', name: '1099-NEC', icon: '🎨', correct: true },
                    { id: 'fake', name: 'W-2 Form', icon: '📄', correct: false }
                ],
                deductions: [],
                refund: 0,
                time: 60
            },
            4: {
                name: "Jordan Chen",
                story: "Jordan has a coffee shop job ($8,500 W-2) AND freelance photos ($3,200 1099). Bought a $1,200 camera.",
                docs: [
                    { id: 'w2', name: 'W-2 Coffee', icon: '☕', correct: true },
                    { id: '1099', name: '1099 Photo', icon: '📷', correct: true }
                ],
                deductions: [
                    { id: 'cam', name: 'Camera', desc: 'Business equipment $1,200', amount: 1200, correct: true },
                    { id: 'coffee', name: 'Coffee', desc: 'Daily coffee $450', amount: 450, correct: false, audit: true }
                ],
                refund: 0,
                time: 90
            },
            5: {
                name: "Riley Park",
                story: "Riley tutors math ($5,000 1099) and drove 600 miles between students. Learn the mileage deduction!",
                docs: [{ id: '1099', name: '1099 Tutoring', icon: '📚', correct: true }],
                deductions: [
                    { id: 'miles', name: 'Mileage', desc: '600 miles x $0.67', amount: 402, correct: true },
                    { id: 'commute', name: 'Commute', desc: 'Home to work', amount: 850, correct: false, audit: true }
                ],
                refund: 0,
                time: 90
            },
            6: {
                name: "Casey Blake",
                story: "Casey has $12,000 in 1099 income. Some deductions look suspicious. Learn to spot red flags!",
                docs: [{ id: '1099', name: '1099 Income', icon: '📱', correct: true }],
                deductions: [
                    { id: 'phone', name: 'Phone 60%', desc: 'Business use $540', amount: 540, correct: true },
                    { id: 'round', name: 'Round Numbers', desc: 'Exactly $1,000 x3', amount: 3000, correct: false, audit: true },
                    { id: 'clothes', name: 'Work Clothes', desc: 'Regular clothes $800', amount: 800, correct: false, audit: true }
                ],
                refund: 0,
                time: 90
            },
            7: {
                name: "Sam Torres",
                story: "Sam drives Uber ($18,000) and DoorDash ($8,500). Multiple 1099s and vehicle expenses!",
                docs: [
                    { id: 'uber', name: '1099-K Uber', icon: '🚗', correct: true },
                    { id: 'dd', name: '1099-NEC DD', icon: '🍔', correct: true }
                ],
                deductions: [
                    { id: 'vehicle', name: 'Vehicle', desc: 'Standard mileage', amount: 4200, correct: true },
                    { id: 'meals', name: 'All Meals', desc: 'Personal food', amount: 2400, correct: false, audit: true }
                ],
                refund: 0,
                time: 105
            },
            8: {
                name: "Jordan Lee",
                story: "Jordan traded crypto and LOST $2,000. Learn how losses can actually HELP your taxes!",
                docs: [{ id: 'crypto', name: '1099-B Crypto', icon: '₿', correct: true }],
                deductions: [
                    { id: 'loss', name: 'Crypto Loss', desc: 'Deduct up to $3,000', amount: 2000, correct: true },
                    { id: 'ignore', name: 'Hide Loss', desc: 'Do not report', amount: 0, correct: false, audit: true }
                ],
                refund: 0,
                time: 90
            },
            9: {
                name: "Alex Rivera (Graduated)",
                story: "The ultimate test! Alex has W-2 income, 1099 design work, crypto losses, and drove 800 miles.",
                docs: [
                    { id: 'w2', name: 'W-2 Pool', icon: '🏊', correct: true },
                    { id: '1099', name: '1099 Design', icon: '💻', correct: true },
                    { id: 'crypto', name: '1099-B Crypto', icon: '₿', correct: true }
                ],
                deductions: [
                    { id: 'miles', name: 'Mileage', desc: '800 miles', amount: 536, correct: true },
                    { id: 'laptop', name: 'Laptop', desc: '$1,200 for work', amount: 1200, correct: true },
                    { id: 'crypto', name: 'Crypto Loss', desc: '$1,500 loss', amount: 1500, correct: true },
                    { id: 'office', name: 'Home Office', desc: '20% of rent', amount: 2400, correct: false, audit: true }
                ],
                refund: 0,
                time: 120
            }
        };

        // GAME STATE
        let state = {
            score: 0,
            unlocked: [1, 2, 3],
            completed: [],
            current: null,
            selectedDocs: new Set(),
            selectedDeducts: new Set(),
            timer: null,
            timeLeft: 0
        };

        // INITIALIZE
        function init() {
            renderLevels();
            setupEventListeners();
        }

        function renderLevels() {
            const list = document.getElementById('levelsList');
            list.innerHTML = '';
            
            for (let i = 1; i <= 9; i++) {
                const lvl = LEVELS[i];
                const locked = !state.unlocked.includes(i);
                const completed = state.completed.includes(i);
                
                const card = document.createElement('div');
                card.className = 'level-card' + (locked ? ' locked' : '');
                if (!locked) {
                    card.onclick = () => startLevel(i);
                }
                
                card.innerHTML = `
                    <span class="level-num">${completed ? '✓' : '#' + i}</span>
                    <h3>${lvl.name}</h3>
                    <p>${lvl.story.substring(0, 60)}...</p>
                `;
                list.appendChild(card);
            }
        }

        function startLevel(n) {
            state.current = n;
            state.selectedDocs.clear();
            state.selectedDeducts.clear();
            const lvl = LEVELS[n];
            
            // Setup screen
            document.getElementById('clientName').textContent = lvl.name;
            document.getElementById('clientStory').textContent = lvl.story;
            
            // Docs
            const docsList = document.getElementById('docsList');
            docsList.innerHTML = '';
            lvl.docs.forEach(doc => {
                const div = document.createElement('div');
                div.className = 'doc-card';
                div.innerHTML = `<div class="icon">${doc.icon}</div><div class="name">${doc.name}</div>`;
                div.onclick = () => {
                    div.classList.toggle('selected');
                    if (state.selectedDocs.has(doc.id)) {
                        state.selectedDocs.delete(doc.id);
                    } else {
                        state.selectedDocs.add(doc.id);
                    }
                };
                docsList.appendChild(div);
            });
            
            // Deductions
            const deductList = document.getElementById('deductList');
            const deductTitle = document.getElementById('deductTitle');
            deductList.innerHTML = '';
            
            if (lvl.deductions.length > 0) {
                deductTitle.style.display = 'block';
                lvl.deductions.forEach(d => {
                    const div = document.createElement('div');
                    div.className = 'deduction-item' + (d.audit ? ' audit' : '');
                    div.innerHTML = `
                        <div class="check"></div>
                        <div class="deduction-info">
                            <h4>${d.name}</h4>
                            <p>${d.desc}</p>
                            <div class="audit-warning">⚠️ Audit risk!</div>
                        </div>
                        <div class="deduction-amt">$${d.amount}</div>
                    `;
                    div.onclick = () => {
                        div.classList.toggle('selected');
                        if (state.selectedDeducts.has(d.id)) {
                            state.selectedDeducts.delete(d.id);
                        } else {
                            state.selectedDeducts.add(d.id);
                        }
                    };
                    deductList.appendChild(div);
                });
            } else {
                deductTitle.style.display = 'none';
            }
            
            // Timer
            state.timeLeft = lvl.time;
            updateTimer();
            if (state.timer) clearInterval(state.timer);
            state.timer = setInterval(() => {
                state.timeLeft--;
                updateTimer();
                if (state.timeLeft <= 0) {
                    clearInterval(state.timer);
                    fileReturn();
                }
            }, 1000);
            
            showScreen('gameScreen');
        }

        function updateTimer() {
            const pct = (state.timeLeft / LEVELS[state.current].time) * 100;
            document.getElementById('timerFill').style.width = pct + '%';
        }

        function fileReturn() {
            if (state.timer) clearInterval(state.timer);
            const lvl = LEVELS[state.current];
            
            // Calculate score
            let score = 0;
            let correctDocs = 0;
            let correctDeducts = 0;
            let auditRisk = 0;
            
            // Check docs
            lvl.docs.forEach(d => {
                if (d.correct && state.selectedDocs.has(d.id)) {
                    score += 100;
                    correctDocs++;
                } else if (!d.correct && state.selectedDocs.has(d.id)) {
                    score -= 50;
                    auditRisk++;
                }
            });
            
            // Check deductions
            lvl.deductions.forEach(d => {
                if (d.correct && state.selectedDeducts.has(d.id)) {
                    score += 50;
                    correctDeducts++;
                } else if (!d.correct && state.selectedDeducts.has(d.id)) {
                    score -= 100;
                    auditRisk += 2;
                }
            });
            
            // Time bonus
            score += state.timeLeft * 2;
            
            // Results
            const audited = auditRisk >= 2;
            let status = 'Perfect!';
            if (audited) status = 'AUDIT!';
            else if (score < 100) status = 'Incomplete';
            
            document.getElementById('resStatus').textContent = status;
            document.getElementById('resStatus').className = 'result-value ' + (audited ? 'bad' : 'good');
            document.getElementById('resDocs').textContent = `${correctDocs}/${lvl.docs.filter(d => d.correct).length}`;
            document.getElementById('resDeduct').textContent = `$${correctDeducts * 100}`;
            document.getElementById('resRefund').textContent = `$${audited ? Math.floor(lvl.refund * 0.5) : lvl.refund}`;
            document.getElementById('resScore').textContent = Math.max(0, score);
            
            // Save progress
            if (!audited && !state.completed.includes(state.current)) {
                state.completed.push(state.current);
                const next = state.current + 1;
                if (next <= 9 && !state.unlocked.includes(next)) {
                    state.unlocked.push(next);
                }
            }
            state.score += Math.max(0, score);
            document.getElementById('totalScore').textContent = state.score;
            
            showScreen('resultScreen');
        }

        function showScreen(id) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.getElementById(id).classList.add('active');
        }

        function setupEventListeners() {
            document.getElementById('fileBtn').onclick = fileReturn;
            document.getElementById('continueBtn').onclick = () => {
                renderLevels();
                showScreen('homeScreen');
            };
        }

        // START
        init();
    </script>
</body>
</html>
